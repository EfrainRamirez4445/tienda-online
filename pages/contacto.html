<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contacto | Estilo Urbano</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Las rutas llevan ../ porque esta página está dentro de la carpeta pages -->
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

  <header>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand" href="../index.html">Estilo Urbano</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menu">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="camisas.html">Camisas</a></li>
            <li class="nav-item"><a class="nav-link" href="joyeria.html">Joyería</a></li>
            <li class="nav-item"><a class="nav-link" href="perfumes.html">Perfumes</a></li>
            <li class="nav-item"><a class="nav-link" href="tenis.html">Tenis</a></li>
            <li class="nav-item"><a class="nav-link" href="contacto.html">Contacto</a></li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <main class="container my-4">
  <section>
    <h1 class="mb-4">Contacto</h1>
    <!-- Formulario validado con JavaScript (novalidate desactiva la validación del navegador) -->
    <form id="formContacto" novalidate class="col-12 col-md-8 col-lg-6">
      <div class="mb-3">
        <label for="nombre" class="form-label">Nombre</label>
        <input type="text" class="form-control" id="nombre">
        <div class="invalid-feedback">Escribe tu nombre (mínimo 3 letras).</div>
      </div>
      <div class="mb-3">
        <label for="correo" class="form-label">Correo electrónico</label>
        <input type="email" class="form-control" id="correo">
        <div class="invalid-feedback">Escribe un correo válido.</div>
      </div>
      <div class="mb-3">
        <label for="mensaje" class="form-label">Mensaje</label>
        <textarea class="form-control" id="mensaje" rows="4"></textarea>
        <div class="invalid-feedback">El mensaje debe tener al menos 10 caracteres.</div>
      </div>
      <button type="submit" class="btn btn-dark">Enviar</button>
      <p id="exito" class="text-success mt-3 d-none">¡Mensaje enviado correctamente!</p>
    </form>
  </section>
</main>
  <footer class="bg-dark text-white text-center py-3">
    <p class="mb-0">&copy; 2026 Estilo Urbano. Todos los derechos reservados.</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/script.js"></script>
</body>
</html>
